services:
  web:
    build: ./web
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
      MONGO_DB: mydatabase
      MONGO_COLLECTION: mycollection
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - app-net
    restart: unless-stopped

  scheduler:
    build: ./scheduler
    env_file:
      - .env
    environment:
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
      MONGO_DB: mydatabase
      MONGO_COLLECTION: mycollection
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      SCHEDULER_INTERVAL: "10"
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app-net
    restart: unless-stopped

  worker1:
    build: ./worker
    env_file:
      - .env
    environment:
      MONGO_HOST: 127.0.0.1
      MONGO_PORT: "27017"
      MONGO_DB: mydatabase
      MONGO_RESULTS_COLLECTION: router_interface_results
      RABBITMQ_HOST: 127.0.0.1
      RABBITMQ_PORT: "5672"
      ROUTER_DEVICE_TYPE: cisco_ios
      SSH_CONNECT_TIMEOUT: "10"
      SSH_COMMAND_TIMEOUT: "30"
      WORKER_RETRY_INTERVAL: "5"
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    network_mode: host
    restart: unless-stopped

  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    env_file:
      - .env
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand('ping').ok"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app-net
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      - .env
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app-net
    restart: unless-stopped

volumes:
  mongo-data:
  rabbitmq-data:

networks:
  app-net:
    driver: bridge
